[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Atelier persistent team collaboration core and CLI"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "process"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_14"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
